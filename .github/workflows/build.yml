# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: build

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token for nuget.org Trusted Publishing

    steps:
    - uses: actions/checkout@v4
    - run: |
          ./.tools/update-version.ps1 -RepoDirectory "${{ github.workspace }}" -Version "1.0.${{ github.run_number }}.0" -Hash "${{ github.sha }}"
      name: update version
      shell: pwsh  
    - name: setup .net
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: restore dependencies
      run: dotnet restore
    - name: build
      run: dotnet build -c Release --no-restore
    - name: test
      run: dotnet test -c Release --no-build --verbosity normal
    - name: nuget login
      # Exchanges the OIDC token for a short-lived (1 hour) nuget.org API key; no stored key needed.
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}
    - run: |
          ./.tools/push-nuget.ps1 -RepoDirectory "${{ github.workspace }}" -ApiKey "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
      name: push nuget packages
      shell: pwsh  
